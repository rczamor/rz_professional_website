name: Canonical URL Smoke Test

on:
  deployment_status:
  workflow_dispatch:
    inputs:
      base_url:
        description: "Base URL to smoke test"
        required: false
        default: "https://www.richezamor.com"

jobs:
  smoke:
    if: github.event_name != 'deployment_status' || (github.event.deployment_status.state == 'success' && github.event.deployment.environment == 'Production')
    runs-on: ubuntu-latest
    env:
      SMOKE_BASE_URL: ${{ github.event.inputs.base_url || 'https://www.richezamor.com' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Smoke test canonical URLs
        run: npm run smoke:canonical
